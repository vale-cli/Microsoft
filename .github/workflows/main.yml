name: Build + Test

on: [push, pull_request]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # The archive is what users install, so the license travels
      # inside it.
      - run: cp LICENSE Microsoft/LICENSE
      - run: zip -r Microsoft.zip Microsoft -x "*.DS_Store"

      - name: Upload style to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Microsoft.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Deps
        run: |
          wget https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz
          mkdir bin && tar -xvzf vale_${VALE_VERSION}_Linux_64-bit.tar.gz -C bin
          echo "$PWD/bin" >> $GITHUB_PATH

          pip install yamllint pyyaml docutils
        env:
          VALE_VERSION: 3.16.0

      - name: Lint
        run: yamllint -c .yamllint.yml Microsoft/ coverage/

      - name: Tests
        run: go test ./...

      - name: Integration
        run: vale README.md
